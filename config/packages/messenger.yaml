framework:
    messenger:
        # Default bus configuration
        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        # Transport definition
        transports:
            async: '%env(MESSENGER_TRANSPORT_DSN)%'

        # Routing rules
        routing:
            App\Command\Domain\Event\CommandPlaced: async
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async

# En test : les e-mails restent en mémoire (pas de worker, pas d'écriture dans messenger_messages)
# et se vérifient avec assertQueuedEmailCount()
when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
