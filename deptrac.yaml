deptrac:
  paths:
    - src
  exclude_files:
    - '#.*test.*#'

  layers:
    - name: Catalog
      collectors:
        - type: directory
          value: src/Catalog/.*
    - name: Cart
      collectors:
        - type: directory
          value: src/Cart/.*
    - name: Payment
      collectors:
        - type: directory
          value: src/Payment/.*
    - name: Order
      collectors:
        - type: directory
          value: src/Order/.*
    - name: Delivery
      collectors:
        - type: directory
          value: src/Delivery/.*
    - name: Notification
      collectors:
        - type: directory
          value: src/Notification/.*
    # Noyau partagé (ports transverses comme EventPublisher), utilisable par tous les contextes
    - name: Shared
      collectors:
        - type: directory
          value: src/Shared/.*

  ruleset:
    Shared: []

    Catalog:
      - Shared

    Cart:
      - Catalog
      - Shared

    Payment:
      - Cart
      - Shared

    Order:
      - Catalog
      - Cart
      - Payment
      - Shared

    Delivery:
      - Order
      - Shared

    Notification:
      - Delivery
      - Order
      - Shared
