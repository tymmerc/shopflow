# Contrat de l'API ShopFlow (jalon 5). Écrit AVANT le code : les routes se codent à partir d'ici.
# Pour le lire joliment : coller ce fichier sur https://editor.swagger.io (Swagger UI viendra à l'étape 3).
#
# Comment avancer :
#   1. GET /api/products est entièrement rempli : c'est le modèle à suivre.
#   2. Les routes marquées « À FAIRE » sont à compléter sur le même schéma.
#   3. Les erreurs utilisent toutes le même format (components/schemas/Problem), celui que Symfony renvoie déjà.

openapi: 3.1.0

info:
  title: API ShopFlow
  version: 0.1.0
  description: |
    API REST en JSON de la boutique ShopFlow (composants électroniques et robotique).
    Utilisée par le front (fetch) et par l'appli mobile partenaire.

servers:
  - url: http://localhost:8000
    description: Dev local (Docker Compose)

tags:
  - name: Produits
  - name: Panier
  - name: Commandes

paths:
  # ---------------------------------------------------------------- Produits

  /api/products:
    get:
      tags: [Produits]
      summary: Lister les produits
      description: Les produits en rupture sont inclus (avec stock à 0), placés en fin de liste.
      operationId: listProducts
      parameters:
        - name: category
          in: query
          required: false
          description: Ne garder qu'une catégorie.
          schema:
            type: string
            enum: [Cartes, Moteurs, Capteurs, Câblage, Outillage]
        - name: level
          in: query
          required: false
          schema:
            type: string
            enum: [Débutant, Intermédiaire, Confirmé]
      responses:
        "200":
          description: La liste des produits (éventuellement vide).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProductSummary"
              example:
                items:
                  - id: 14
                    name: Carte Arduino Uno R3 compatible
                    category: Cartes
                    level: Débutant
                    price: 14.9
                    stock: 42
                    image: /images/products/arduino-uno-r3.jpg
        "400":
          description: Une catégorie ou un niveau qui n'existe pas.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://tools.ietf.org/html/rfc2616#section-10
                title: An error occurred
                status: 400
                detail: Catégorie inconnue « Robots ».

  /api/products/{id}:
    get:
      tags: [Produits]
      summary: Voir un produit (fiche complète)
      operationId: getProduct
      parameters:
        - name: id
          in: path
          required: true
          description: Num du produit.
          schema:
            type: integer
      responses:
        "200":
          description: Voici ton produit !
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
           
        "404":
          description: Aucun produit qui possède cet identifiant :(
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://tools.ietf.org/html/rfc2616#section-10
                title: An error occurred
                status: 404
                detail: Produit introuvable.

  # ---------------------------------------------------------------- Panier
  # Le panier existe déjà (CartApiController, fait par Nathan) : ici on DÉCRIT ce qu'il fait, sans le changer.
  # Il est rattaché au visiteur par un cookie, donc pas d'{id} de panier dans l'adresse.

  /api/cart:
    get:
      tags: [Panier]
      summary: Voir le panier du visiteur
      operationId: getCart
      responses:
        "200":
          description: Le panier, vide s'il n'existe pas encore.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
    put:
      tags: [Panier]
      summary: Remplacer tout le panier
      description: Sert à annuler « Vider le panier » en renvoyant l'ancienne liste.
      operationId: replaceCart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [id, quantity]
                    properties:
                      id:
                        type: integer
                        description: L'id du produit.
                      quantity:
                        type: integer
                        minimum: 1
            example:
              items:
                - id: 14
                  quantity: 2
                - id: 18
                  quantity: 1
      responses:
        "200":
          description: Le panier après remplacement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "415":
          description: Le corps de la requête n'est pas du JSON.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Une ligne n'a pas d'id entier, ou une quantité est inférieure à 1.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    # À FAIRE : delete (vider le panier). Regarder CartApiController::clear().

  /api/cart/items/{id}:
    # À FAIRE : post (ajouter), put (changer la quantité), delete (retirer).
    #  Corps attendu pour post et put : { "quantity": 2 }
    #  Erreurs : 404 produit inconnu, 415 pas du JSON, 422 quantité < 1 ou pas un entier.
    parameters:
      - name: id
        in: path
        required: true
        description: L'id du produit.
        schema:
          type: integer

  # ---------------------------------------------------------------- Commandes
  # À FAIRE, à décider d'abord en équipe :
  #  - POST /api/orders : passer commande à partir du panier. Que renvoie-t-on ? (201 + la commande créée ?)
  #    Que se passe-t-il si le panier est vide (422 ?) ou si un produit n'a plus assez de stock (409 ?) ?
  #  - GET /api/orders/{id} : voir une commande et son statut.

components:
  schemas:
    ProductSummary:
      description: Ce qu'il faut pour afficher une carte produit dans une liste.
      type: object
      required: [id, name, price, stock]
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: [string, "null"]
        level:
          type: [string, "null"]
          enum: [Débutant, Intermédiaire, Confirmé, null]
        price:
          type: number
          description: Prix TTC en euros.
        stock:
          type: integer
          minimum: 0
        image:
          type: [string, "null"]
          description: Chemin de la photo, relatif au site.

    ProductDetail:
      description: La fiche complète d'un produit = tout ProductSummary, plus les détails techniques.
      allOf:
        - $ref: "#/components/schemas/ProductSummary"
        - type: object
          properties:
            tagline:
              type: [string, "null"]
              description: À quoi ça sert, en une phrase.
            description:
              type: [string, "null"]
            solderingRequired:
              type: [boolean, "null"]
              description: Faut-il souder pour l'utiliser ?
            specs:
              type: array
              description: Caractéristiques techniques, dans l'ordre d'affichage.
              items:
                type: array
                description: Une paire [libellé, valeur avec unité].
                prefixItems:
                  - type: string
                  - type: string
                minItems: 2
                maxItems: 2
              example:
                - [Tension de fonctionnement, 5 V]
                - [Poids, 25 g]
            compatibility:
              type: array
              items:
                type: string
              example: [Arduino Uno, ESP32]
            boxContents:
              type: array
              description: Ce qui est livré dans la boîte.
              items:
                type: string

    CartLine:
      type: object
      required: [id, name, price, stock, url, qty]
      properties:
        id:
          type: integer
          description: L'id du produit.
        name:
          type: string
        price:
          type: number
        stock:
          type: integer
        url:
          type: string
          description: Lien vers la fiche produit.
        qty:
          type: integer
          minimum: 1

    Cart:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartLine"

    Problem:
      description: |
        Format commun de toutes les erreurs (RFC 7807), celui que Symfony renvoie déjà pour une route en JSON.
        En dev, Symfony ajoute aussi « class » et « trace » pour déboguer : ils n'apparaissent pas en production.
      type: object
      required: [title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
          description: Le message lisible, en français.
