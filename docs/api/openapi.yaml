# Contrat de l'API ShopFlow (jalon 5). Écrit AVANT le code : les routes ont été codées à partir d'ici.
# Pour le lire et tester les routes : http://localhost:8000/api/docs (Swagger UI, dans ShopFlow).
#
# Toutes les erreurs utilisent le même format (components/schemas/Problem), celui que Symfony renvoie.
# Les réponses qui reviennent souvent (panier à jour, pas du JSON, etc.) sont écrites une fois
# dans components/responses et réutilisées avec $ref.

openapi: 3.1.0

info:
  title: API ShopFlow
  version: 0.1.0
  description: |
    API REST en JSON de la boutique ShopFlow (composants électroniques et robotique).
    Utilisée par le front (fetch) et par l'appli mobile partenaire.

servers:
  - url: /
    description: "Le site qui affiche cette page (en dev local, http://localhost:8000)"

tags:
  - name: Produits
  - name: Panier
  - name: Commandes

paths:
  # ---------------------------------------------------------------- Produits

  /api/products:
    get:
      tags: [Produits]
      summary: Lister les produits
      description: Les produits en rupture sont inclus (avec stock à 0), placés en fin de liste.
      operationId: listProducts
      parameters:
        - name: category
          in: query
          required: false
          description: Ne garder qu'une catégorie.
          schema:
            type: string
            enum: [Cartes, Moteurs, Capteurs, Câblage, Outillage]
        - name: level
          in: query
          required: false
          schema:
            type: string
            enum: [Débutant, Intermédiaire, Confirmé]
      responses:
        "200":
          description: La liste des produits (éventuellement vide).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProductSummary"
              example:
                items:
                  - id: 14
                    name: Carte Arduino Uno R3 compatible
                    category: Cartes
                    level: Débutant
                    price: 14.9
                    stock: 42
                    image: /images/products/arduino-uno-r3.jpg
        "400":
          description: Une catégorie ou un niveau qui n'existe pas.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://tools.ietf.org/html/rfc2616#section-10
                title: An error occurred
                status: 400
                detail: Catégorie inconnue « Robots ».

  /api/products/{id}:
    get:
      tags: [Produits]
      summary: Voir un produit (fiche complète)
      operationId: getProduct
      parameters:
        - name: id
          in: path
          required: true
          description: Num du produit.
          schema:
            type: integer
      responses:
        "200":
          description: Voici ton produit !
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
           
        "404":
          description: Aucun produit qui possède cet identifiant :(
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://tools.ietf.org/html/rfc2616#section-10
                title: An error occurred
                status: 404
                detail: Produit introuvable.

  # ---------------------------------------------------------------- Panier
  # Le panier existe déjà (CartApiController, fait par Nathan) : ici on DÉCRIT ce qu'il fait, sans le changer.
  # Il est rattaché au visiteur par un cookie, donc pas d'{id} de panier dans l'adresse.

  /api/cart:
    get:
      tags: [Panier]
      summary: Voir le panier du visiteur
      operationId: getCart
      responses:
        "200":
          description: Le panier, vide s'il n'existe pas encore.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
    put:
      tags: [Panier]
      summary: Remplacer tout le panier
      description: Sert à annuler « Vider le panier » en renvoyant l'ancienne liste.
      operationId: replaceCart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [id, quantity]
                    properties:
                      id:
                        type: integer
                        description: L'id du produit.
                      quantity:
                        type: integer
                        minimum: 1
            example:
              items:
                - id: 14
                  quantity: 2
                - id: 18
                  quantity: 1
      responses:
        "200":
          description: Le panier après remplacement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "415":
          description: Le corps de la requête n'est pas du JSON.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Une ligne n'a pas d'id entier, ou une quantité est inférieure à 1.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      tags: [Panier]
      summary: Vider le panier
      description: Rien à envoyer. Renvoie le panier, vide.
      operationId: clearCart
      responses:
        "200":
          description: Le panier vidé.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
              example:
                items: []

  /api/cart/items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: L'id du produit.
        schema:
          type: integer
    post:
      tags: [Panier]
      summary: Ajouter un produit au panier
      description: Si le produit est déjà dans le panier, la quantité s'ajoute. Elle est plafonnée au stock.
      operationId: addCartItem
      requestBody:
        $ref: "#/components/requestBodies/Quantity"
      responses:
        "200":
          $ref: "#/components/responses/CartOk"
        "404":
          $ref: "#/components/responses/ProductNotFound"
        "415":
          $ref: "#/components/responses/NotJson"
        "422":
          $ref: "#/components/responses/BadQuantity"
    put:
      tags: [Panier]
      summary: Changer la quantité d'un produit du panier
      operationId: updateCartItem
      requestBody:
        $ref: "#/components/requestBodies/Quantity"
      responses:
        "200":
          $ref: "#/components/responses/CartOk"
        "404":
          $ref: "#/components/responses/ProductNotFound"
        "415":
          $ref: "#/components/responses/NotJson"
        "422":
          $ref: "#/components/responses/BadQuantity"
    delete:
      tags: [Panier]
      summary: Retirer un produit du panier
      operationId: removeCartItem
      responses:
        "200":
          $ref: "#/components/responses/CartOk"
        "404":
          $ref: "#/components/responses/ProductNotFound"

  # ---------------------------------------------------------------- Commandes
  # La commande se passe à partir du panier du visiteur (cookie) : pas besoin de renvoyer les produits.

  /api/orders:
    post:
      tags: [Commandes]
      summary: Passer commande à partir du panier
      description: |
        Crée la commande « en attente de paiement » et démarre le paiement.
        Le client doit ensuite aller sur paymentUrl. Le stock n'est retiré qu'une fois le paiement réussi.
      operationId: placeOrder
      requestBody:
        required: true
        description: Rien à envoyer, mais le corps doit être du JSON (protection CSRF), un objet vide suffit.
        content:
          application/json:
            schema:
              type: object
            example: {}
      responses:
        "201":
          description: Commande créée. L'en-tête Location donne son adresse dans l'API.
          headers:
            Location:
              schema:
                type: string
              example: /api/orders/2
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Order"
                  - type: object
                    required: [paymentUrl]
                    properties:
                      paymentUrl:
                        type: string
                        description: Page du prestataire de paiement (le faux en dev).
        "409":
          description: Un produit n'a plus assez de stock pour la quantité du panier.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                status: 409
                title: An error occurred
                detail: Stock insuffisant pour « Capteur à ultrasons HC-SR04 ». Ajustez la quantité dans le panier.
        "415":
          $ref: "#/components/responses/NotJson"
        "422":
          description: Le panier est vide.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                status: 422
                title: An error occurred
                detail: "Impossible de passer commande : le panier est vide."

  /api/orders/{id}:
    get:
      tags: [Commandes]
      summary: Voir une commande et son statut
      operationId: getOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: La commande.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Aucune commande avec cet id pour ce client.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                status: 404
                title: An error occurred
                detail: Commande introuvable.

components:

  requestBodies:
    Quantity:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [quantity]
            properties:
              quantity:
                type: integer
                minimum: 1
          example:
            quantity: 2

  responses:
    CartOk:
      description: Le panier mis à jour.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Cart"
    ProductNotFound:
      description: Aucun produit avec cet id.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotJson:
      description: Le corps de la requête n'est pas du JSON.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadQuantity:
      description: La quantité manque, n'est pas un entier, ou est inférieure à 1.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    ProductSummary:
      description: Ce qu'il faut pour afficher une carte produit dans une liste.
      type: object
      required: [id, name, price, stock]
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: [string, "null"]
        level:
          type: [string, "null"]
          enum: [Débutant, Intermédiaire, Confirmé, null]
        price:
          type: number
          description: Prix TTC en euros.
        stock:
          type: integer
          minimum: 0
        image:
          type: [string, "null"]
          description: Chemin de la photo, relatif au site.

    ProductDetail:
      description: La fiche complète d'un produit = tout ProductSummary, plus les détails techniques.
      allOf:
        - $ref: "#/components/schemas/ProductSummary"
        - type: object
          properties:
            tagline:
              type: [string, "null"]
              description: À quoi ça sert, en une phrase.
            description:
              type: [string, "null"]
            solderingRequired:
              type: [boolean, "null"]
              description: Faut-il souder pour l'utiliser ?
            specs:
              type: array
              description: Caractéristiques techniques, dans l'ordre d'affichage.
              items:
                type: array
                description: Une paire [libellé, valeur avec unité].
                prefixItems:
                  - type: string
                  - type: string
                minItems: 2
                maxItems: 2
              example:
                - [Tension de fonctionnement, 5 V]
                - [Poids, 25 g]
            compatibility:
              type: array
              items:
                type: string
              example: [Arduino Uno, ESP32]
            boxContents:
              type: array
              description: Ce qui est livré dans la boîte.
              items:
                type: string

    CartLine:
      type: object
      required: [id, name, price, stock, url, qty]
      properties:
        id:
          type: integer
          description: L'id du produit.
        name:
          type: string
        price:
          type: number
        stock:
          type: integer
        url:
          type: string
          description: Lien vers la fiche produit.
        qty:
          type: integer
          minimum: 1

    Cart:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartLine"

    Order:
      type: object
      required: [id, status, placedAt, total, lines]
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [pending_payment, paid, payment_failed, cancelled]
        placedAt:
          type: string
          format: date-time
        total:
          type: number
          description: Total TTC en euros.
        lines:
          type: array
          items:
            type: object
            required: [productId, unitPrice, quantity, subtotal]
            properties:
              productId:
                type: integer
              name:
                type: [string, "null"]
              unitPrice:
                type: number
                description: Prix au moment de la commande (il ne bouge plus ensuite).
              quantity:
                type: integer
              subtotal:
                type: number

    Problem:
      description: |
        Format commun de toutes les erreurs (RFC 7807), celui que Symfony renvoie déjà pour une route en JSON.
        En dev, Symfony ajoute aussi « class » et « trace » pour déboguer : ils n'apparaissent pas en production.
      type: object
      required: [title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
          description: Le message lisible, en français.
