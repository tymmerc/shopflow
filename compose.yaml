# Environnement de dev ShopFlow : appli Symfony, MySQL, Mailpit.
# Lancer : docker compose up -d --build, puis http://localhost:8000
services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    ports:
      - "127.0.0.1:${HTTP_PORT:-8000}:80"
    volumes:
      # Symfony est dans l'image ; on branche seulement le code qu'on modifie
      - ./src:/var/www/html/src
      - ./templates:/var/www/html/templates
      - ./config:/var/www/html/config
      - ./migrations:/var/www/html/migrations
      # Pour qu'un composer require dans le conteneur reste dans le dépôt
      - ./composer.json:/var/www/html/composer.json
      - ./composer.lock:/var/www/html/composer.lock
      - ./symfony.lock:/var/www/html/symfony.lock
      - ./.env:/var/www/html/.env
    depends_on:
      database:
        condition: service_healthy
    mem_limit: 512m

  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: shopflow
      MYSQL_USER: app
      # Mots de passe de dev uniquement, jamais en prod
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uapp", "-papp"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    mem_limit: 768m

  mailer:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    mem_limit: 128m

volumes:
  database_data:
