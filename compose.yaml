# Environnement de dev ShopFlow : appli Symfony, MySQL, Adminer, Mailpit.
# Lancer : docker compose up -d --build, puis http://localhost:8000
# Adminer : http://localhost:8080 (serveur database, user app / mdp app)
services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    ports:
      - "127.0.0.1:${HTTP_PORT:-8000}:80"
    volumes:
      # Symfony est dans l'image ; on branche seulement le code qu'on modifie
      - ./src:/var/www/html/src
      - ./templates:/var/www/html/templates
      - ./assets:/var/www/html/assets
      - ./config:/var/www/html/config
      - ./migrations:/var/www/html/migrations
      # Tests : docker compose exec php php bin/phpunit
      - ./tests:/var/www/html/tests
      - ./phpunit.dist.xml:/var/www/html/phpunit.dist.xml
      # Pour qu'un composer require dans le conteneur reste dans le dépôt
      - ./composer.json:/var/www/html/composer.json
      - ./composer.lock:/var/www/html/composer.lock
      - ./symfony.lock:/var/www/html/symfony.lock
      - ./.env:/var/www/html/.env
      # CSS compilée par le service tailwind (le binaire est déjà dans l'image)
      - tailwind_build:/var/www/html/var/tailwind
    depends_on:
      database:
        condition: service_healthy
    mem_limit: 512m

  # Envoie les e-mails mis en file par Messenger (transport doctrine) : le paiement n'attend pas le serveur mail.
  # Après une modification de config/ ou src/ qui touche l'envoi : docker compose restart worker
  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php bin/console messenger:consume async --time-limit=3600 -vv
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html/src
      - ./templates:/var/www/html/templates
      - ./config:/var/www/html/config
      - ./composer.json:/var/www/html/composer.json
      - ./composer.lock:/var/www/html/composer.lock
      - ./.env:/var/www/html/.env
    depends_on:
      database:
        condition: service_healthy
      mailer:
        condition: service_started
    mem_limit: 256m

  # Recompile la CSS à chaque modification de assets/ ou templates/
  tailwind:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    user: www-data
    command: php bin/console tailwind:build --watch
    volumes:
      - ./templates:/var/www/html/templates
      - ./assets:/var/www/html/assets
      - ./config:/var/www/html/config
      - tailwind_build:/var/www/html/var/tailwind
    mem_limit: 256m

  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: shopflow
      MYSQL_USER: app
      # Mots de passe de dev uniquement, jamais en prod
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - database_data:/var/lib/mysql
      # Exécuté uniquement à la création du volume (premier lancement)
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uapp", "-papp"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    mem_limit: 768m

  adminer:
    image: adminer:5
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: database
    depends_on:
      - database
    mem_limit: 64m

  mailer:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    mem_limit: 128m

volumes:
  database_data:
  tailwind_build:
