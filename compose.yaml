services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    ports:
      - "127.0.0.1:${HTTP_PORT:-8000}:80"
    volumes:
      - ./src:/var/www/html/src
      - ./templates:/var/www/html/templates
      - ./assets:/var/www/html/assets
      - ./config:/var/www/html/config
      - ./migrations:/var/www/html/migrations
      - ./tests:/var/www/html/tests
      - ./phpunit.dist.xml:/var/www/html/phpunit.dist.xml
      - ./.env:/var/www/html/.env
      - tailwind_build:/var/www/html/var/tailwind
    depends_on:
      database:
        condition: service_healthy
    mem_limit: 512m

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    user: www-data
    command: php bin/console messenger:consume async --time-limit=600 --memory-limit=128M -vv
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html/src
      - ./config:/var/www/html/config
    depends_on:
      database:
        condition: service_healthy
      mailer:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 256m

  tailwind:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    user: www-data
    command: php bin/console tailwind:build --watch
    volumes:
      - ./templates:/var/www/html/templates
      - ./assets:/var/www/html/assets
      - ./config:/var/www/html/config
      - tailwind_build:/var/www/html/var/tailwind
    mem_limit: 256m

  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: shopflow
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - database_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uapp", "-papp"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    mem_limit: 768m

  adminer:
    image: adminer:5
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: database
    depends_on:
      - database
    mem_limit: 64m

  mailer:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    mem_limit: 128m

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 512m

volumes:
  database_data:
  tailwind_build:
  rabbitmq_data: